name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Серверные тесты
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установить зависимости
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Компиляция
        run: python -m compileall -q app

      - name: Тесты
        run: |
          set -o pipefail
          for suite in test_runner_e2e test_http_api test_features_api test_workspace_api test_cancel test_braced_text; do
            echo "== $suite =="
            python "tests/$suite.py"
          done
