<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="title">CrewAI Studio — вход</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: radial-gradient(1100px 600px at 20% -10%, #251a3f 0%, #0f1117 55%, #0a0b10 100%);
    color: #e9ecf3; font: 14px/1.5 "Segoe UI", system-ui, sans-serif;
  }
  .card {
    width: min(420px, calc(100vw - 32px)); padding: 28px;
    background: #151824; border: 1px solid #262b3d; border-radius: 16px;
    box-shadow: 0 24px 60px rgba(0,0,0,.45);
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .logo {
    width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center;
    background: linear-gradient(135deg, #8b5cf6, #6d28d9); font-weight: 700;
  }
  h1 { font-size: 17px; margin: 0; }
  .sub { color: #8b91a7; font-size: 12px; }
  h2 { font-size: 15px; margin: 0 0 4px; }
  .hint { color: #8b91a7; font-size: 12px; margin: 0 0 16px; }
  label { display: block; font-size: 12px; color: #aab1c5; margin: 12px 0 4px; }
  input {
    width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid #2c3247;
    background: #0f1220; color: #e9ecf3; font-size: 14px; outline: none;
  }
  input:focus { border-color: #7c5cff; }
  button {
    width: 100%; margin-top: 18px; padding: 11px; border: 0; border-radius: 10px;
    background: linear-gradient(135deg, #8b5cf6, #6d28d9); color: #fff; font-weight: 600;
    font-size: 14px; cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: default; }
  .error { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: #2a1620; border: 1px solid #5b2333; color: #ffb4c0; font-size: 13px; }
  .switch { margin-top: 14px; text-align: center; font-size: 13px; color: #8b91a7; }
  .switch a { color: #b9a5ff; cursor: pointer; text-decoration: none; }
  .hidden { display: none; }
</style>
</head>
<body>
  <form class="card" id="auth-form">
    <div class="brand">
      <div class="logo">M</div>
      <div>
        <h1>CrewAI Studio</h1>
        <div class="sub" id="brand-sub" data-i18n="brand.sub">локальный интерфейс</div>
      </div>
    </div>

    <div id="login-block">
      <h2 data-i18n="login.title">Вход</h2>
      <p class="hint" data-i18n="login.hint">Введите логин и пароль, чтобы открыть рабочее пространство.</p>
      <label for="login-user" data-i18n="login.user">Логин</label>
      <input id="login-user" name="username" autocomplete="username" spellcheck="false" data-i18n-ph="login.user">
      <label for="login-pass" data-i18n="login.pass">Пароль</label>
      <input id="login-pass" name="password" type="password" autocomplete="current-password" data-i18n-ph="login.pass">
      <button type="submit" id="login-submit" data-i18n="login.submit">Войти</button>
      <div class="switch"><span data-i18n="login.noAccount">Нет аккаунта?</span> <a id="to-register" data-i18n="login.register">Зарегистрироваться</a></div>
    </div>

    <div id="register-block" class="hidden">
      <h2 id="register-title" data-i18n="register.title">Регистрация</h2>
      <p class="hint" id="register-hint" data-i18n="register.hint">Создайте аккаунт: логин 3–32 символа, пароль не короче 8.</p>
      <label for="reg-user" data-i18n="register.user">Логин</label>
      <input id="reg-user" name="new_username" autocomplete="username" spellcheck="false" data-i18n-ph="register.user">
      <label for="reg-pass" data-i18n="register.pass">Пароль</label>
      <input id="reg-pass" name="new_password" type="password" autocomplete="new-password" data-i18n-ph="register.pass">
      <button type="submit" id="register-submit" data-i18n="register.submit">Создать аккаунт</button>
      <div class="switch" id="register-switch"><span data-i18n="register.hasAccount">Уже есть аккаунт?</span> <a id="to-login" data-i18n="register.login">Войти</a></div>
    </div>

    <div class="error hidden" id="auth-error"></div>
  </form>
  <script src="/login.js" defer></script>
</body>
</html>
