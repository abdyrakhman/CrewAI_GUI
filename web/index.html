<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="studio-token" content="__STUDIO_TOKEN__">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CrewAI Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237c5cff'/%3E%3Cpath d='M9 22V10h4l3 6 3-6h4v12h-3v-7l-3 6h-2l-3-6v7z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="26" height="26"><rect width="32" height="32" rx="9" fill="url(#g)"/><path d="M8.5 23V9h4.2l3.3 6.6L19.3 9h4.2v14h-3.2v-8.4l-3.2 6.4h-2.2l-3.2-6.4V23z" fill="#fff"/><defs><linearGradient id="g" x1="0" y1="0" x2="32" y2="32"><stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs></svg>
      </div>
      <div class="brand-text">
        <strong>CrewAI Studio</strong>
        <span id="brand-version">локальный интерфейс</span>
      </div>
    </div>

    <button class="btn btn-primary btn-block" id="btn-new-crew" data-action="new-crew">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Новый проект
    </button>

    <div class="side-section">
      <span>Проекты</span>
      <span class="side-count" id="crew-count"></span>
    </div>
    <nav class="crew-list" id="crew-list" aria-label="Проекты"></nav>

    <div class="side-section">Разделы</div>
    <nav class="side-nav" id="side-nav">
      <button data-view="templates"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>Шаблоны</button>
      <button data-view="roles"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 11.5a3 3 0 1 0 0-6"/><path d="M17 14c2.8 0 5 2.2 5 5"/></svg>Роли</button>
      <button data-view="history"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 8v4l3 2"/></svg>История запусков</button>
      <button data-view="files"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7a2 2 0 0 1 2-2h3l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/></svg>Файлы проекта</button>
      <button data-view="settings"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Настройки</button>
    </nav>

    <div class="side-footer">
      <span class="dot" id="engine-dot"></span>
      <span id="engine-label">проверка окружения…</span>
    </div>
  </aside>

  <main class="main">
    <header class="topbar" id="topbar"></header>
    <section class="view" id="view">
      <div class="loading-screen">
        <div class="spinner"></div>
        <p>Загружаю проекты…</p>
      </div>
    </section>
  </main>
</div>

<div class="toasts" id="toasts"></div>
<button class="run-indicator hidden" id="run-indicator" data-action="open-active-run" title="Вернуться к выполнению">
  <span class="run-indicator-dot"></span>
  <span class="run-indicator-text" id="run-indicator-text">Выполняется</span>
  <span class="run-indicator-arrow">→</span>
</button>
<div class="modal-root" id="modal-root"></div>
<script src="/static/i18n-content.js"></script>
<script src="/static/i18n.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
